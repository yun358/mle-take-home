[project]
name = "company-recommendation-system"
version = "0.0.0"
description = "Turn a company event feed into a similar-companies service with RabbitMQ and pgvector."
requires-python = ">=3.14,<3.15"
dependencies = [
  "aio-pika",
  "fastapi>=0.165.0",
  "numpy>=2.5.5",
  "onnxruntime>=1.32.0",
  "pgvector>=0.5.1",
  "psycopg[binary]>=3.3.9",
  "tokenizers>=0.23.3",
  "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["producer"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
